name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: trading-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Validate immutable GitHub Action runtime pins
        shell: pwsh
        run: ./scripts/test-github-action-pins.ps1
      - name: Run Gradle verification
        run: |
          chmod +x gradlew
          ./gradlew check --no-daemon --build-cache --parallel

  runtime-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Smoke-test runtime containers
        env:
          BUILDX_CACHE_SCOPE_PREFIX: trading-runtime
        run: |
          chmod +x scripts/test-container-runtime.sh
          scripts/test-container-runtime.sh linux/amd64
